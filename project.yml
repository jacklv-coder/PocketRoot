name: PocketRootDemo

options:
  bundleIdPrefix: com.jacklv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  PocketRoot:
    path: .

targets:
  PocketRootIshRuntimeCompileSpike:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Spikes/PocketRootIshRuntimeCompileSpike

    dependencies:
      - package: PocketRoot
        product: PocketRootIshRuntimeIntegration

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklv.PocketRootIshRuntimeCompileSpike
        PRODUCT_NAME: PocketRootIshRuntimeCompileSpike
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  PocketRootIshRuntimeSmoke:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Spikes/PocketRootIshRuntimeSmoke

    dependencies:
      - package: PocketRoot
        product: PocketRootCore
      - package: PocketRoot
        product: PocketRootIshRuntimeIntegration
      - package: PocketRoot
        product: PocketRootResources
      - package: PocketRoot
        product: PocketRootTerminal

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklv.PocketRootIshRuntimeSmoke
        PRODUCT_NAME: PocketRootIshRuntimeSmoke
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: YES
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  PocketRootDemo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Demo/PocketRootDemo
        excludes:
          - Resources

    resources:
      - path: Demo/PocketRootDemo/Resources

    dependencies:
      - package: PocketRoot
        product: PocketRoot

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklv.PocketRootDemo
        PRODUCT_NAME: PocketRootDemo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

    info:
      path: Demo/PocketRootDemo/Info.plist
      properties:
        CFBundleDisplayName: PocketRoot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"

  PocketRootDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Tests/PocketRootDemoTests
        optional: true

    dependencies:
      - target: PocketRootDemo

schemes:
  PocketRootIshRuntimeCompileSpike:
    build:
      targets:
        PocketRootIshRuntimeCompileSpike: all
    analyze:
      config: Debug

  PocketRootIshRuntimeSmoke:
    build:
      targets:
        PocketRootIshRuntimeSmoke: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  PocketRootDemo:
    build:
      targets:
        PocketRootDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
