name: Bug report / 错误报告
description: Report a reproducible, non-sensitive PocketRoot defect. / 报告可复现且不敏感的 PocketRoot 错误。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PocketRoot. Do not attach credentials, signing material, private device data, RootFS archives, Apps, IPAs, or XCFrameworks. Report security issues through SECURITY.md.

        感谢帮助改进 PocketRoot。请勿附加凭据、签名材料、私有设备数据、RootFS、App、IPA 或 XCFramework；安全问题请按 SECURITY.md 私下报告。
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface / 影响范围
      options:
        - Terminal or PTY / 终端或 PTY
        - Files or Workspace / 文件或 Workspace
        - RootFS verification or installation / RootFS 校验或安装
        - Runtime boot, command, or lifecycle / Runtime 启动、命令或生命周期
        - Swift Package integration or build / Swift Package 接入或构建
        - Demo or example App / Demo 或示例 App
        - Optional Agent component / 可选 Agent 组件
        - Documentation or tooling / 文档或工具
        - Other / 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PocketRoot version or full commit / PocketRoot 版本或完整 commit
      placeholder: v0.1.0 or 40-character commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Include Xcode, iOS, device or Simulator, architecture, and selected package products. / 包含 Xcode、iOS、设备或 Simulator、架构和所选 package products。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现
      description: List deterministic steps and the smallest relevant integration code. / 列出确定性步骤和最小相关接入代码。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include sanitized errors or logs and say whether the failure is repeatable. / 包含已脱敏错误或日志，并说明能否重复复现。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already attempted / 已尝试检查
      description: Mention relevant commands from Docs/Testing.md and whether a physical device was actually used. / 说明 Docs/Testing.md 中已运行的命令，以及是否真实使用真机。
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations / 确认
      options:
        - label: I searched existing Issues and the troubleshooting guide. / 我已搜索现有 Issue 和故障排查文档。
          required: true
        - label: This report contains no credentials, signing material, personal data, RootFS, App, IPA, XCFramework, or other unauthorized binary. / 本报告不含凭据、签名材料、个人数据、RootFS、App、IPA、XCFramework 或其他未经授权的二进制。
          required: true
        - label: This is not an unpatched security vulnerability. / 这不是尚未修复的安全漏洞。
          required: true
