name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      include_ipad:
        description: Run the milestone iPad UI suites as well
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.classify.outputs.package }}
      ios: ${{ steps.classify.outputs.ios }}
      native: ${{ steps.classify.outputs.native }}
      ui: ${{ steps.classify.outputs.ui }}
      external: ${{ steps.classify.outputs.external }}
      reused_pr_ci: ${{ steps.classify.outputs.reused_pr_ci }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select required validation tiers
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse_output="$RUNNER_TEMP/pocketroot-pr-ci-reuse"
          : > "$reuse_output"
          if [[ "$EVENT_NAME" == "push" ]]; then
            if ! ruby Scripts/verify-pr-ci-reuse.rb \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$HEAD_SHA" \
              --base-ref "main" \
              --output "$reuse_output"; then
              echo "reused_pr_ci=false" > "$reuse_output"
              echo "reuse_reason=verifier_failed" >> "$reuse_output"
            fi
          else
            echo "reused_pr_ci=false" > "$reuse_output"
            echo "reuse_reason=not_main_push" >> "$reuse_output"
          fi

          reused_pr_ci="$(
            awk -F= '$1 == "reused_pr_ci" { value = $2 } END { print value }' \
              "$reuse_output"
          )"
          if [[ "$reused_pr_ci" == "true" ]]; then
            {
              echo "package=false"
              echo "ios=false"
              echo "native=false"
              echo "ui=false"
              echo "external=false"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ./Scripts/classify-ci-changes.sh \
              --full \
              --output "$GITHUB_OUTPUT"
          else
            if [[ -z "$BASE_SHA" ||
                  "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi
            ./Scripts/classify-ci-changes.sh \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --output "$GITHUB_OUTPUT"
          fi
          cat "$reuse_output" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: Test and build
    needs: classify-changes
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure public package submodule checkout
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            "ssh://git@ssh.github.com:443/"

      - name: Validate bilingual documentation
        run: ./Scripts/check-docs.sh

      - name: Validate smoke runner scripts
        run: |
          bash -n Scripts/run-runtime-smoke.sh
          bash -n Scripts/run-runtime-device-smoke.sh
          bash -n Scripts/build-signed-engineering-archive.sh
          bash -n Scripts/inject-demo-rootfs.sh
          bash -n Scripts/classify-ci-changes.sh
          ruby -c Scripts/verify-pr-ci-reuse.rb
          bash -n Scripts/run-external-consumer-ui-smoke.sh
          ruby -c Scripts/prepare-rootfs-smoke-manifest.rb
          ruby -c Scripts/rootfs-corresponding-source-review-results.rb
          ruby -c Scripts/rootfs-license-review.rb
          ruby -c Scripts/rootfs-license-review-results.rb
          ruby -c Scripts/rootfs-license-notice-candidates.rb
          ruby -c Scripts/rootfs-license-notice-review-results.rb
          ruby -c Scripts/rootfs-rebuild-delivery-evidence.rb
          ruby -c Scripts/prepare-rootfs-license-review.rb
          ruby -c Scripts/prepare-rootfs-license-notice-bundle.rb
          ruby -c Scripts/prepare-rootfs-delivery-candidate.rb
          ruby -c Scripts/rootfs-source-acquisition.rb
          ruby -c Scripts/prepare-rootfs-source-bundle.rb
          ruby -c Scripts/pocketroot-deterministic-json.rb
          ruby -c Scripts/generate-release-compliance.rb
          ruby -c Scripts/scan-release-artifact.rb
          ruby -c Scripts/verify-source-release.rb
          bash -n Scripts/verify-immutable-upstream-releases.sh
          bash -n Scripts/verify-swiftpm-release-tag.sh
          bash -n Tests/Scripts/RuntimeSmokeScriptTests.sh
          bash -n Tests/Scripts/SignedEngineeringArchiveScriptTests.sh
          bash -n Tests/Scripts/RootFSCandidateSmokeManifestTests.sh
          bash -n Tests/Scripts/DemoRootFSInjectionScriptTests.sh
          bash -n Tests/Scripts/CIChangeClassifierTests.sh
          ruby -c Tests/Scripts/PRCIReuseTests.rb
          ruby -c Tests/Scripts/RootFSLicenseReviewTests.rb
          ruby -c Tests/Scripts/RootFSCorrespondingSourceReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSLicenseReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeCandidatesTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeBundleTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSRebuildDeliveryEvidenceTests.rb
          ruby -c Tests/Scripts/RootFSDeliveryCandidateTests.rb
          ruby -c Tests/Scripts/RootFSSourceBundleTests.rb
          ruby -c Tests/Scripts/ReleaseComplianceTests.rb
          ruby -c Tests/Scripts/ReleaseArtifactScannerTests.rb
          ruby -c Tests/Scripts/SourceReleaseVerificationTests.rb
          bash Tests/Scripts/RuntimeSmokeScriptTests.sh
          bash Tests/Scripts/SignedEngineeringArchiveScriptTests.sh
          bash Tests/Scripts/RootFSCandidateSmokeManifestTests.sh
          bash Tests/Scripts/DemoRootFSInjectionScriptTests.sh
          bash Tests/Scripts/CIChangeClassifierTests.sh
          ruby Tests/Scripts/PRCIReuseTests.rb
          ruby Tests/Scripts/RootFSCorrespondingSourceReviewResultsTests.rb
          ruby Tests/Scripts/RootFSLicenseReviewTests.rb
          ruby Tests/Scripts/RootFSLicenseReviewResultsTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeCandidatesTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeBundleTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeReviewResultsTests.rb
          ruby Tests/Scripts/RootFSRebuildDeliveryEvidenceTests.rb
          ruby Tests/Scripts/RootFSDeliveryCandidateTests.rb
          ruby Tests/Scripts/RootFSSourceBundleTests.rb
          ruby Tests/Scripts/ReleaseComplianceTests.rb
          ruby Tests/Scripts/ReleaseArtifactScannerTests.rb
          ruby Tests/Scripts/SourceReleaseVerificationTests.rb
          ruby Scripts/prepare-rootfs-license-review.rb --validate-only
          ruby Scripts/rootfs-corresponding-source-review-results.rb
          ruby Scripts/rootfs-license-review-results.rb
          ruby Scripts/rootfs-license-notice-candidates.rb
          ruby Scripts/rootfs-license-notice-review-results.rb
          ruby Scripts/rootfs-rebuild-delivery-evidence.rb
          ruby Scripts/prepare-rootfs-license-notice-bundle.rb --validate-only
          ruby Scripts/prepare-rootfs-delivery-candidate.rb --validate-only
          ruby Scripts/prepare-rootfs-source-bundle.rb --validate-only
          ruby Scripts/generate-release-compliance.rb --check
          ruby Scripts/generate-release-compliance.rb --status
          ruby Scripts/verify-source-release.rb \
            --version 0.2.0 \
            --ref HEAD \
            --report "$RUNNER_TEMP/pocketroot-v0.2.0-source-candidate.json"

      - name: Upload source candidate audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocketroot-source-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pocketroot-v0.2.0-source-candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Report Apple toolchain
        if: ${{ needs.classify-changes.outputs.package == 'true' }}
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Run Swift package tests
        if: ${{ needs.classify-changes.outputs.package == 'true' }}
        run: swift test

      - name: Validate pinned RootFS release archive
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        env:
          ROOTFS_SHA256: "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4"
          ROOTFS_BYTE_COUNT: "6581376"
          ROOTFS_URL: "https://github.com/Lolendor/ish-arm64-pkg/releases/download/v0.3.3/fs.tar.gz"
          SPDX_SCHEMA_SHA256: "239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b"
          SPDX_SCHEMA_URL: "https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json"
        run: |
          archive="$RUNNER_TEMP/pocketroot-fs-v0.3.3.tar.gz"
          spdx_schema="$RUNNER_TEMP/spdx-2.3-schema.json"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "$ROOTFS_URL"
          test "$(stat -f '%z' "$archive")" = "$ROOTFS_BYTE_COUNT"
          echo "$ROOTFS_SHA256  $archive" | shasum -a 256 --check
          POCKETROOT_ROOTFS_ARCHIVE="$archive" \
            swift test --filter testPinnedReleaseArchiveWhenProvidedByEnvironment
          POCKETROOT_ROOTFS_ARCHIVE="$archive" \
            bash Tests/Scripts/DemoRootFSInjectionScriptTests.sh
          ruby Scripts/generate-rootfs-compliance.rb \
            --archive "$archive" \
            --check
          curl --fail --location --retry 3 \
            --output "$spdx_schema" \
            "$SPDX_SCHEMA_URL"
          echo "$SPDX_SCHEMA_SHA256  $spdx_schema" \
            | shasum -a 256 --check
          npm ci \
            --prefix Scripts/rootfs-compliance-validator \
            --ignore-scripts \
            --no-audit \
            --no-fund
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$spdx_schema" \
            Compliance/RootFS/v0.3.3/SBOM.spdx.json
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$spdx_schema" \
            Compliance/Release/experimental-v0.2.0/SBOM.spdx.json
          echo "POCKETROOT_SPDX_SCHEMA=$spdx_schema" >> "$GITHUB_ENV"
          echo "POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodegen version
          (
            cd Examples/PocketRootDemo
            xcodegen generate --spec project.yml
          )
          (
            cd Examples/PocketRootHostApp
            xcodegen generate --spec project.yml
          )
          (
            cd Examples/PocketRootQuickStartApp
            xcodegen generate --spec project.yml
          )

      - name: Build for generic iOS Simulator
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootDemo/PocketRootDemo.xcodeproj \
            -scheme PocketRootDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE="$POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE" \
            build
          demo_rootfs="$RUNNER_TEMP/PocketRootDerivedData/Build/Products/Debug-iphonesimulator/PocketRootDemo.app/pocketroot-fs-v0.3.3.tar.gz"
          test "$(stat -f '%z' "$demo_rootfs")" = "6581376"
          echo "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4  $demo_rootfs" \
            | shasum -a 256 --check

      - name: Build standalone Host App integration example
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootHostApp/PocketRootHostApp.xcodeproj \
            -scheme PocketRootHostApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootHostAppDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE="$POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE" \
            build
          host_rootfs="$RUNNER_TEMP/PocketRootHostAppDerivedData/Build/Products/Debug-iphonesimulator/PocketRootHostApp.app/pocketroot-fs-v0.3.3.tar.gz"
          test "$(stat -f '%z' "$host_rootfs")" = "6581376"
          echo "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4  $host_rootfs" \
            | shasum -a 256 --check

      - name: Build two-entry Quick Start integration example
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootQuickStartApp/PocketRootQuickStartApp.xcodeproj \
            -scheme PocketRootQuickStartApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootQuickStartDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE="$POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE" \
            build
          quick_start_rootfs="$RUNNER_TEMP/PocketRootQuickStartDerivedData/Build/Products/Debug-iphonesimulator/PocketRootQuickStartApp.app/pocketroot-fs-v0.3.3.tar.gz"
          test "$(stat -f '%z' "$quick_start_rootfs")" = "6581376"
          echo "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4  $quick_start_rootfs" \
            | shasum -a 256 --check

      - name: Compile Demo unit tests
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootDemo/PocketRootDemo.xcodeproj \
            -scheme PocketRootDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE="$POCKETROOT_DEVELOPMENT_ROOTFS_ARCHIVE" \
            build-for-testing

      - name: Final-link iSH runtime app for arm64 iOS Simulator
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootDemo/PocketRootDemo.xcodeproj \
            -scheme PocketRootIshRuntimeCompileSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootIshRuntimeCompileSpikeDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Final-link iSH runtime app for arm64 iOS device
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          xcodebuild \
            -project Examples/PocketRootDemo/PocketRootDemo.xcodeproj \
            -scheme PocketRootIshRuntimeCompileSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootIshRuntimeDeviceCompileSpikeDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Scan unsigned iSH runtime engineering app
        if: ${{ needs.classify-changes.outputs.ios == 'true' }}
        run: |
          app="$RUNNER_TEMP/PocketRootIshRuntimeDeviceCompileSpikeDerivedData/Build/Products/Debug-iphoneos/PocketRootIshRuntimeCompileSpike.app"
          evidence="$RUNNER_TEMP/PocketRootIshRuntimeArtifactScan"
          ruby Scripts/scan-release-artifact.rb \
            --app "$app" \
            --output "$evidence" \
            --expected-bundle-identifier \
              com.jacklv.PocketRootIshRuntimeCompileSpike
          ruby Scripts/scan-release-artifact.rb \
            --app "$app" \
            --verify "$evidence" \
            --expected-bundle-identifier \
              com.jacklv.PocketRootIshRuntimeCompileSpike \
            --require-clean
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$POCKETROOT_SPDX_SCHEMA" \
            "$evidence/SBOM.spdx.json"

  minimum-xcode-16-runtime:
    name: Minimum Xcode 16.0 / Native runtime
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum Xcode 16 environment
        uses: ./.github/actions/setup-minimum-xcode-16
        with:
          install-simulator-runtime: "false"

      - name: Validate real RootFS install with Xcode 16.0
        run: |
          swift test \
            --filter testPinnedReleaseArchiveWhenProvidedByEnvironment

      - name: Install iOS 18.0 Simulator runtime
        run: |
          xcrun simctl list >/dev/null
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes available
          xcrun simctl list runtimes available \
            | grep -F "iOS 18.0"

      - name: Final-link runtime with Xcode 16.0
        run: ./Scripts/build-runtime-spike.sh

      - name: Run native smoke with Xcode 16.0
        env:
          POCKETROOT_SMOKE_TIMEOUT_SECONDS: "600"
          POCKETROOT_SMOKE_STABILITY: "1"
          POCKETROOT_SMOKE_STABILITY_ITERATIONS: "30"
          POCKETROOT_SMOKE_STABILITY_INTERVAL_MILLISECONDS: "250"
        run: ./Scripts/run-runtime-smoke.sh

  minimum-xcode-16-ui:
    name: Minimum Xcode 16.0 / UI (${{ matrix.label }})
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.ui == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: external-consumer
            label: External consumer
            ipad: false
          - suite: quick-start-iphone
            label: Quick Start iPhone
            ipad: false
          - suite: quick-start-ipad
            label: Quick Start iPad
            ipad: true
          - suite: host-iphone
            label: Host App iPhone
            ipad: false
          - suite: host-ipad
            label: Host App iPad
            ipad: true

    steps:
      - name: Check out repository
        if: >-
          ${{
            needs.classify-changes.outputs.ui == 'true' &&
            (matrix.suite != 'external-consumer' ||
              needs.classify-changes.outputs.external == 'true') &&
            (!matrix.ipad ||
              (github.event_name == 'workflow_dispatch' && inputs.include_ipad))
          }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum Xcode 16 environment
        if: >-
          ${{
            needs.classify-changes.outputs.ui == 'true' &&
            (matrix.suite != 'external-consumer' ||
              needs.classify-changes.outputs.external == 'true') &&
            (!matrix.ipad ||
              (github.event_name == 'workflow_dispatch' && inputs.include_ipad))
          }}
        uses: ./.github/actions/setup-minimum-xcode-16

      - name: Run ${{ matrix.label }} UI smoke with Xcode 16.0
        if: >-
          ${{
            needs.classify-changes.outputs.ui == 'true' &&
            (matrix.suite != 'external-consumer' ||
              needs.classify-changes.outputs.external == 'true') &&
            (!matrix.ipad ||
              (github.event_name == 'workflow_dispatch' && inputs.include_ipad))
          }}
        env:
          POCKETROOT_UI_SUITE: ${{ matrix.suite }}
          POCKETROOT_UI_FAILURE_ROOT: >-
            ${{ runner.temp }}/pocketroot-ui-artifacts/${{ matrix.suite }}
          POCKETROOT_EXTERNAL_CONSUMER_REPOSITORY_URL: >-
            ${{ github.event.pull_request.head.repo.clone_url ||
                format('{0}/{1}.git', github.server_url, github.repository) }}
          POCKETROOT_EXTERNAL_CONSUMER_REVISION: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          POCKETROOT_EXTERNAL_CONSUMER_REQUIRE_REMOTE: "1"
          POCKETROOT_HOST_UI_ONLY_TESTING: >-
            ${{ github.event_name != 'workflow_dispatch' &&
                'PocketRootHostAppUITests/PocketRootHostAppUITests/testPTYCommandCreatesFileVisibleInFiles' ||
                '' }}
        run: |
          case "$POCKETROOT_UI_SUITE" in
            external-consumer)
              export POCKETROOT_UI_FAILURE_ARTIFACTS_DIR="$POCKETROOT_UI_FAILURE_ROOT"
              ./Scripts/run-external-consumer-ui-smoke.sh
              ;;
            quick-start-iphone)
              export POCKETROOT_UI_FAILURE_ARTIFACTS_DIR="$POCKETROOT_UI_FAILURE_ROOT"
              ./Scripts/run-quick-start-ui-smoke.sh
              ;;
            quick-start-ipad)
              export POCKETROOT_QUICK_START_UI_DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation"
              export POCKETROOT_QUICK_START_UI_DEVICE_NAME="PocketRoot-Quick-Start-iPad-UI-Smoke"
              export POCKETROOT_UI_FAILURE_ARTIFACTS_DIR="$POCKETROOT_UI_FAILURE_ROOT"
              ./Scripts/run-quick-start-ui-smoke.sh
              ;;
            host-iphone)
              export POCKETROOT_HOST_UI_FAILURE_ARTIFACTS_DIR="$POCKETROOT_UI_FAILURE_ROOT"
              ./Scripts/run-host-app-ui-smoke.sh
              ;;
            host-ipad)
              export POCKETROOT_HOST_UI_DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation"
              export POCKETROOT_HOST_UI_DEVICE_NAME="PocketRoot-Host-iPad-UI-Smoke"
              export POCKETROOT_HOST_UI_FAILURE_ARTIFACTS_DIR="$POCKETROOT_UI_FAILURE_ROOT"
              ./Scripts/run-host-app-ui-smoke.sh
              ;;
            *)
              echo "Unknown minimum-Xcode UI suite: $POCKETROOT_UI_SUITE" >&2
              exit 2
              ;;
          esac

      - name: Upload UI failure diagnostics
        if: >-
          ${{
            failure() &&
            needs.classify-changes.outputs.ui == 'true' &&
            (matrix.suite != 'external-consumer' ||
              needs.classify-changes.outputs.external == 'true') &&
            (!matrix.ipad ||
              (github.event_name == 'workflow_dispatch' && inputs.include_ipad))
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocketroot-ui-failure-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pocketroot-ui-artifacts/${{ matrix.suite }}
          if-no-files-found: warn
          retention-days: 7
