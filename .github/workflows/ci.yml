name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure public package submodule checkout
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            "ssh://git@ssh.github.com:443/"

      - name: Validate bilingual documentation
        run: ./Scripts/check-docs.sh

      - name: Validate smoke runner scripts
        run: |
          bash -n Scripts/run-runtime-smoke.sh
          bash -n Scripts/run-runtime-device-smoke.sh
          bash -n Scripts/build-signed-engineering-archive.sh
          ruby -c Scripts/prepare-rootfs-smoke-manifest.rb
          ruby -c Scripts/rootfs-corresponding-source-review-results.rb
          ruby -c Scripts/rootfs-license-review.rb
          ruby -c Scripts/rootfs-license-review-results.rb
          ruby -c Scripts/rootfs-license-notice-candidates.rb
          ruby -c Scripts/rootfs-license-notice-review-results.rb
          ruby -c Scripts/rootfs-rebuild-delivery-evidence.rb
          ruby -c Scripts/prepare-rootfs-license-review.rb
          ruby -c Scripts/prepare-rootfs-license-notice-bundle.rb
          ruby -c Scripts/prepare-rootfs-delivery-candidate.rb
          ruby -c Scripts/rootfs-source-acquisition.rb
          ruby -c Scripts/prepare-rootfs-source-bundle.rb
          ruby -c Scripts/pocketroot-deterministic-json.rb
          ruby -c Scripts/generate-release-compliance.rb
          ruby -c Scripts/scan-release-artifact.rb
          bash -n Tests/Scripts/RuntimeSmokeScriptTests.sh
          bash -n Tests/Scripts/SignedEngineeringArchiveScriptTests.sh
          bash -n Tests/Scripts/RootFSCandidateSmokeManifestTests.sh
          ruby -c Tests/Scripts/RootFSLicenseReviewTests.rb
          ruby -c Tests/Scripts/RootFSCorrespondingSourceReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSLicenseReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeCandidatesTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeBundleTests.rb
          ruby -c Tests/Scripts/RootFSLicenseNoticeReviewResultsTests.rb
          ruby -c Tests/Scripts/RootFSRebuildDeliveryEvidenceTests.rb
          ruby -c Tests/Scripts/RootFSDeliveryCandidateTests.rb
          ruby -c Tests/Scripts/RootFSSourceBundleTests.rb
          ruby -c Tests/Scripts/ReleaseComplianceTests.rb
          ruby -c Tests/Scripts/ReleaseArtifactScannerTests.rb
          bash Tests/Scripts/RuntimeSmokeScriptTests.sh
          bash Tests/Scripts/SignedEngineeringArchiveScriptTests.sh
          bash Tests/Scripts/RootFSCandidateSmokeManifestTests.sh
          ruby Tests/Scripts/RootFSCorrespondingSourceReviewResultsTests.rb
          ruby Tests/Scripts/RootFSLicenseReviewTests.rb
          ruby Tests/Scripts/RootFSLicenseReviewResultsTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeCandidatesTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeBundleTests.rb
          ruby Tests/Scripts/RootFSLicenseNoticeReviewResultsTests.rb
          ruby Tests/Scripts/RootFSRebuildDeliveryEvidenceTests.rb
          ruby Tests/Scripts/RootFSDeliveryCandidateTests.rb
          ruby Tests/Scripts/RootFSSourceBundleTests.rb
          ruby Tests/Scripts/ReleaseComplianceTests.rb
          ruby Tests/Scripts/ReleaseArtifactScannerTests.rb
          ruby Scripts/prepare-rootfs-license-review.rb --validate-only
          ruby Scripts/rootfs-corresponding-source-review-results.rb
          ruby Scripts/rootfs-license-review-results.rb
          ruby Scripts/rootfs-license-notice-candidates.rb
          ruby Scripts/rootfs-license-notice-review-results.rb
          ruby Scripts/rootfs-rebuild-delivery-evidence.rb
          ruby Scripts/prepare-rootfs-license-notice-bundle.rb --validate-only
          ruby Scripts/prepare-rootfs-delivery-candidate.rb --validate-only
          ruby Scripts/prepare-rootfs-source-bundle.rb --validate-only
          ruby Scripts/generate-release-compliance.rb --check

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Run Swift package tests
        run: swift test

      - name: Validate pinned RootFS release archive
        env:
          ROOTFS_SHA256: "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4"
          ROOTFS_BYTE_COUNT: "6581376"
          ROOTFS_URL: "https://github.com/Lolendor/ish-arm64-pkg/releases/download/v0.3.3/fs.tar.gz"
          SPDX_SCHEMA_SHA256: "239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b"
          SPDX_SCHEMA_URL: "https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json"
        run: |
          archive="$RUNNER_TEMP/pocketroot-fs-v0.3.3.tar.gz"
          spdx_schema="$RUNNER_TEMP/spdx-2.3-schema.json"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "$ROOTFS_URL"
          test "$(stat -f '%z' "$archive")" = "$ROOTFS_BYTE_COUNT"
          echo "$ROOTFS_SHA256  $archive" | shasum -a 256 --check
          POCKETROOT_ROOTFS_ARCHIVE="$archive" \
            swift test --filter testPinnedReleaseArchiveWhenProvidedByEnvironment
          ruby Scripts/generate-rootfs-compliance.rb \
            --archive "$archive" \
            --check
          curl --fail --location --retry 3 \
            --output "$spdx_schema" \
            "$SPDX_SCHEMA_URL"
          echo "$SPDX_SCHEMA_SHA256  $spdx_schema" \
            | shasum -a 256 --check
          npm ci \
            --prefix Scripts/rootfs-compliance-validator \
            --ignore-scripts \
            --no-audit \
            --no-fund
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$spdx_schema" \
            Compliance/RootFS/v0.3.3/SBOM.spdx.json
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$spdx_schema" \
            Compliance/Release/experimental-v0.1.0/SBOM.spdx.json
          echo "POCKETROOT_SPDX_SCHEMA=$spdx_schema" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          xcodegen version
          xcodegen generate --spec project.yml

      - name: Build for generic iOS Simulator
        run: |
          xcodebuild \
            -project PocketRootDemo.xcodeproj \
            -scheme PocketRootDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Final-link iSH runtime app for arm64 iOS Simulator
        run: |
          xcodebuild \
            -project PocketRootDemo.xcodeproj \
            -scheme PocketRootIshRuntimeCompileSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootIshRuntimeCompileSpikeDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Final-link iSH runtime app for arm64 iOS device
        run: |
          xcodebuild \
            -project PocketRootDemo.xcodeproj \
            -scheme PocketRootIshRuntimeCompileSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PocketRootIshRuntimeDeviceCompileSpikeDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Scan unsigned iSH runtime engineering app
        run: |
          app="$RUNNER_TEMP/PocketRootIshRuntimeDeviceCompileSpikeDerivedData/Build/Products/Debug-iphoneos/PocketRootIshRuntimeCompileSpike.app"
          evidence="$RUNNER_TEMP/PocketRootIshRuntimeArtifactScan"
          ruby Scripts/scan-release-artifact.rb \
            --app "$app" \
            --output "$evidence" \
            --expected-bundle-identifier \
              com.jacklv.PocketRootIshRuntimeCompileSpike
          ruby Scripts/scan-release-artifact.rb \
            --app "$app" \
            --verify "$evidence" \
            --expected-bundle-identifier \
              com.jacklv.PocketRootIshRuntimeCompileSpike \
            --require-clean
          node Scripts/rootfs-compliance-validator/validate-spdx.mjs \
            "$POCKETROOT_SPDX_SCHEMA" \
            "$evidence/SBOM.spdx.json"

  minimum-xcode-16:
    name: Minimum Xcode 16.0
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure public package submodule checkout
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            "ssh://git@ssh.github.com:443/"

      - name: Verify minimum Apple toolchain
        run: |
          test "$(uname -m)" = "arm64"
          test -d /Applications/Xcode_16.0.app/Contents/Developer
          sudo xcode-select \
            --switch /Applications/Xcode_16.0.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.0"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.0"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "18.0"
          xcodebuild -version
          swift --version

      - name: Download and verify pinned RootFS release archive
        env:
          ROOTFS_SHA256: "be0f3c133f78f28b023288459b33dc28fa253a6ef29f7123bc5f3892edf90ad4"
          ROOTFS_BYTE_COUNT: "6581376"
          ROOTFS_URL: "https://github.com/Lolendor/ish-arm64-pkg/releases/download/v0.3.3/fs.tar.gz"
        run: |
          archive="$RUNNER_TEMP/pocketroot-fs-v0.3.3.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "$ROOTFS_URL"
          test "$(stat -f '%z' "$archive")" = "$ROOTFS_BYTE_COUNT"
          echo "$ROOTFS_SHA256  $archive" | shasum -a 256 --check
          echo "POCKETROOT_ROOTFS_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Validate real RootFS install with Xcode 16.0
        run: |
          swift test \
            --filter testPinnedReleaseArchiveWhenProvidedByEnvironment

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install iOS 18.0 Simulator runtime
        run: |
          xcrun simctl list >/dev/null
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes available
          xcrun simctl list runtimes available \
            | grep -F "iOS 18.0"

      - name: Final-link runtime with Xcode 16.0
        run: ./Scripts/build-runtime-spike.sh

      - name: Run native smoke with Xcode 16.0
        env:
          POCKETROOT_SMOKE_TIMEOUT_SECONDS: "600"
        run: ./Scripts/run-runtime-smoke.sh
