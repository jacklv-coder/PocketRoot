name: PocketRootHostApp

options:
  bundleIdPrefix: com.jacklv.examples
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

packages:
  PocketRoot:
    path: ../..

targets:
  PocketRootHostApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Sources

    dependencies:
      - package: PocketRoot
        product: PocketRoot
      - package: PocketRoot
        product: PocketRootIshRuntimeIntegration

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklv.examples.PocketRootHostApp
        PRODUCT_NAME: PocketRootHostApp
        ARCHS: arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

    postBuildScripts:
      - name: Inject reviewed development RootFS
        script: |
          "$SRCROOT/../../Scripts/inject-demo-rootfs.sh"
        basedOnDependencyAnalysis: false

schemes:
  PocketRootHostApp:
    build:
      targets:
        PocketRootHostApp: all
    run:
      config: Debug
    archive:
      config: Release
